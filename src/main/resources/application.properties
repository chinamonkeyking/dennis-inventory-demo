# -----------------------------------------------------------------------------
# Application
# -----------------------------------------------------------------------------
spring.application.name=dennis-inventory-demo
# Maximum time to wait for in-flight work during graceful shutdown.
spring.lifecycle.timeout-per-shutdown-phase=20s

# -----------------------------------------------------------------------------
# HTTP server
# -----------------------------------------------------------------------------
# Override the port with the SERVER_PORT environment variable.
server.port=${SERVER_PORT:8080}
# Wait for in-flight requests to complete when the application stops.
server.shutdown=graceful

# -----------------------------------------------------------------------------
# H2 in-memory database
# -----------------------------------------------------------------------------
# DB_CLOSE_DELAY=-1 keeps the database alive as long as the JVM is running.
spring.datasource.url=jdbc:h2:mem:inventory;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# H2 JDBC driver.
spring.datasource.driver-class-name=org.h2.Driver
# Demo credentials; data is discarded when the application stops.
spring.datasource.username=sa
spring.datasource.password=

# -----------------------------------------------------------------------------
# HikariCP connection pool
# -----------------------------------------------------------------------------
# Keep a fixed-size pool: minimum-idle equals maximum-pool-size.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=10
# Fail a connection checkout after 30 seconds.
spring.datasource.hikari.connection-timeout=30000

# -----------------------------------------------------------------------------
# JPA / Hibernate
# -----------------------------------------------------------------------------
# Validate the entity mappings against schema.sql without modifying the schema.
spring.jpa.hibernate.ddl-auto=validate
# Do not keep a database session open while rendering the web response.
spring.jpa.open-in-view=false

# -----------------------------------------------------------------------------
# SQL initialization
# -----------------------------------------------------------------------------
# Run schema.sql and data.sql when the application starts.
spring.sql.init.mode=always

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
# Write application logs to both the console and a file.
logging.file.name=logs/inventory.log
# Rotate by date and size, compress old files, and cap total retained log size.
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=500MB
logging.logback.rollingpolicy.file-name-pattern=logs/inventory.%d{yyyy-MM-dd}.%i.log.gz

# Compact log line used by both console and file appenders.
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n

# -----------------------------------------------------------------------------
# Actuator
# -----------------------------------------------------------------------------
# Expose only the health and info endpoints.
management.endpoints.web.exposure.include=health,info
# Enable liveness and readiness groups for deployment probes.
management.endpoint.health.probes.enabled=true
# Allow info.* properties to appear under /actuator/info.
management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.description=Dennis Inventory Demo
